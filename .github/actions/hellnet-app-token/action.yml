name: Hellnet App token
description: Create a least-privilege installation token for hellnet-actions
inputs:
  client-id:
    description: GitHub App client ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  owner:
    description: Installation owner
    required: true
  repositories:
    description: Comma-separated repositories
    required: false
  permission-contents:
    description: Contents permission
    required: false
    default: ''
  permission-issues:
    description: Issues permission
    required: false
    default: ''
  permission-pull-requests:
    description: Pull requests permission
    required: false
    default: ''
  permission-checks:
    description: Checks permission
    required: false
    default: ''
  permission-actions:
    description: Actions permission
    required: false
    default: ''
  permission-statuses:
    description: Commit statuses permission
    required: false
    default: ''
  permission-workflows:
    description: Workflows permission
    required: false
    default: ''
outputs:
  token:
    description: Installation access token
    value: ${{ steps.app-token.outputs.token }}
  app-slug:
    description: GitHub App slug
    value: ${{ steps.app-token.outputs.app-slug }}
  user-id:
    description: Numeric bot user ID
    value: ${{ steps.identity.outputs.user-id }}
runs:
  using: composite
  steps:
    - id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-statuses: ${{ inputs.permission-statuses }}
        permission-workflows: ${{ inputs.permission-workflows }}
    - id: identity
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      run: |
        set -euo pipefail
        user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
        case "$user_id" in
          (''|*[!0-9]*) echo 'Could not resolve numeric App bot user ID' >&2; exit 1 ;;
        esac
        echo "user-id=$user_id" >> "$GITHUB_OUTPUT"
