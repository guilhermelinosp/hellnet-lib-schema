name: process-schema-issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing schema Issue number to process or safely retry
        required: true
        type: number
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: schema-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'schema'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create least-privilege App token
        id: app-token
        uses: ./.github/actions/hellnet-app-token
        with:
          client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hellnet-lib-schema
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-schema-tools

      - name: Generate or resume the schema PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          APP_USER_ID="${{ steps.app-token.outputs.user-id }}"
          export APP_USER_ID
          python3 scripts/process_issue.py --issue "$ISSUE_NUMBER"
