name: pipeline

# Validate contracts and shell scripts before publishing a repository release.
# Workflow-only changes are validated on PRs and do not trigger a release.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate-pr.yml
    permissions:
      contents: read

  release:
    name: release
    needs: validate
    uses: guilhermelinosp/templates/.github/workflows/release.yml@9aa28e4932048b724e165f169963643e8c4bcd69 # main
    permissions:
      contents: write
