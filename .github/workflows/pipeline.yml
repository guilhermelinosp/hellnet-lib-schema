name: pipeline

# Validate contracts and shell scripts before publishing a repository release.
# Workflow-only changes are validated on PRs and do not trigger a release.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate-pr.yml
    permissions:
      contents: read

  release:
    name: release
    needs: validate
    uses: guilhermelinosp/templates/.github/workflows/release.yml@224f59d684d4a225418b4b3b7c6d419d968afb07 # templates control-plane branch
    with:
      app-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit
    permissions:
      contents: write
