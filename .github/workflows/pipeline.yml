name: pipeline

# Validate contracts and shell scripts before publishing a repository release.
# Workflow-only changes are validated on PRs and do not trigger a release.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate-pr.yml
    permissions:
      contents: read

  release:
    name: release
    needs: validate
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
    secrets: inherit
