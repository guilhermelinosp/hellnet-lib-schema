name: tag-schema

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"

permissions: {}

concurrency:
  group: schema-tags-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hellnet-lib-schema
          permission-contents: write

      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App user ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "user-id=$user_id" >> "$GITHUB_OUTPUT"

      - name: Validate contracts before tagging
        run: bash scripts/validate.sh schemas

      - name: Create missing immutable schema tags
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          set -euo pipefail

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          while IFS= read -r meta; do
            name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$meta")"
            version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$meta")"

            case "$meta" in
              schemas/avro/fast/*/*/v*/.meta.json)
                relative="${meta#schemas/avro/fast/}"
                domain="${relative%%/*}"
                remaining="${relative#*/}"
                event="${remaining%%/*}"
                schema_key="fast-${domain}-${event}"
                ;;
              *)
                schema_key="$(basename "$(dirname "$(dirname "$meta")")")"
                ;;
            esac

            tag="schema/${schema_key}/v${version}"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "exists: $tag"
              continue
            fi

            introduced_commit="$(git log --diff-filter=A --format='%H' -- "$meta" | tail -n 1)"
            if [ -z "$introduced_commit" ]; then
              echo "ERROR: cannot find introduction commit for $meta" >&2
              exit 1
            fi

            git tag -a "$tag" "$introduced_commit" -m "schema: ${name} v${version}"
            git push origin "refs/tags/$tag"
            echo "created: $tag -> $introduced_commit"
          done < <(find schemas -type f -name '.meta.json' | LC_ALL=C sort)
