name: tag-schema

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"

permissions: {}

concurrency:
  group: schema-tags-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: hellnet-lib-schema
          permission-contents: write

      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate contracts before tagging
        run: bash scripts/validate.sh schemas

      - name: Create missing immutable schema tags through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS= read -r meta; do
            version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$meta")"

            case "$meta" in
              schemas/avro/fast/*/*/v*/.meta.json)
                relative="${meta#schemas/avro/fast/}"
                domain="${relative%%/*}"
                remaining="${relative#*/}"
                event="${remaining%%/*}"
                schema_key="fast-${domain}-${event}"
                ;;
              *)
                schema_key="$(basename "$(dirname "$(dirname "$meta")")")"
                ;;
            esac

            tag="schema/${schema_key}/v${version}"
            introduced_commit="$(git log --diff-filter=A --format='%H' -- "$meta" | tail -n 1)"
            if [ -z "$introduced_commit" ]; then
              echo "ERROR: cannot find introduction commit for $meta" >&2
              exit 1
            fi

            existing="$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
            if [ -n "$existing" ]; then
              if [ "$existing" != "$introduced_commit" ]; then
                echo "ERROR: immutable tag $tag points to $existing, expected $introduced_commit" >&2
                exit 1
              fi
              echo "exists: $tag -> $existing"
              continue
            fi

            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" \
              -f "sha=$introduced_commit" >/dev/null
            commit_verified="$(gh api "repos/$REPOSITORY/commits/$introduced_commit" --jq '.commit.verification.verified')"
            echo "created: $tag -> $introduced_commit (commit verification.verified=$commit_verified)"
          done < <(find schemas -type f -name '.meta.json' | LC_ALL=C sort)
