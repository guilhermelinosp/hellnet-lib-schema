name: auto-pr

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'build/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  create-pr:
    permissions:
      contents: write
      pull-requests: write
    uses: guilhermelinosp/templates/.github/workflows/auto-pr.yml@9a3e1c923824fbd71b5dad45976c6e66ba2a1a01 # integrated templates main
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit