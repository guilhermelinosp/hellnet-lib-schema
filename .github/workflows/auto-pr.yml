name: auto-pr

on:
  push:
    branches:
      - "bot/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-pr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create least-privilege App token
        id: app-token
        uses: ./.github/actions/hellnet-app-token
        with:
          client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Create or update PR as the App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ]; then exit 0; fi
          existing="$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPOSITORY" --add-label automation
            exit 0
          fi
          title="$(git log -1 --format=%s)"
          [ -n "$title" ] || title="chore: automated update"
          gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" \
            --title "$title" --body "<!-- hellnet-actions-auto-pr -->\nGenerated by hellnet-actions[bot]." \
            --label automation
