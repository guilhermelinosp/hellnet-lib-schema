name: auto-pr

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'build/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  create-pr:
    uses: guilhermelinosp/templates/.github/workflows/auto-pr.yml@41fa69bdb033100b4386fd993d9cf3aff0be1c4f # templates PR #152
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit
