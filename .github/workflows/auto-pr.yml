name: auto-pr

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
      - 'chore/**'
      - 'docs/**'
      - 'refactor/**'
      - 'build/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  create-pr:
    permissions:
      contents: write
      pull-requests: write
    uses: guilhermelinosp/templates/.github/workflows/auto-pr.yml@8f299961846cf1d0cbf7129a99ea6c3095ec3abd
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit