name: auto-pr

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "build/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    uses: guilhermelinosp/templates/.github/workflows/auto-pr.yml@224f59d684d4a225418b4b3b7c6d419d968afb07 # templates control-plane branch
    with:
      app-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit
