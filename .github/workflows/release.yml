name: release

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    uses: guilhermelinosp/templates/.github/workflows/release.yml@cd599423d53ff20e23158c693ff232e783ac7080 # integrated templates main
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit
