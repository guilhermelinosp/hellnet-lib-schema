name: release

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    uses: guilhermelinosp/templates/.github/workflows/release.yml@9aa4a279f308556891c0e24ae61d26c33e36ed3e # templates PR #152
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit
