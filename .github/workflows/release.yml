name: release

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    uses: guilhermelinosp/templates/.github/workflows/release.yml@df74d94727dface3aa3aa9011ab02b8b037f90ea # integrated templates main
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit
