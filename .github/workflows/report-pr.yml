name: hellnet-actions report

on:
  workflow_run:
    workflows: [validate-schema-pr, pr-check, security, codeql]
    types: [completed]

permissions: {}

concurrency:
  group: hellnet-actions-report-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
      - name: Create least-privilege App token
        id: app-token
        uses: ./.github/actions/hellnet-app-token
        with:
          client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write
          permission-checks: write
      - name: Update the single bot report
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKFLOW_RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
        run: python3 scripts/report_pr.py
