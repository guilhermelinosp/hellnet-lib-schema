name: report-pr

on:
  workflow_run:
    workflows: [validate-schema-pr, pr-check, security, codeql]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    uses: guilhermelinosp/templates/.github/workflows/pr-report.yml@745ef1ca8288cd320b0b4dcf1485e34003945c79
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit
