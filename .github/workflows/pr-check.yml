name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@9a3e1c923824fbd71b5dad45976c6e66ba2a1a01 # main

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@9a3e1c923824fbd71b5dad45976c6e66ba2a1a01 # main

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@9a3e1c923824fbd71b5dad45976c6e66ba2a1a01 # main

  policy:
    uses: guilhermelinosp/templates/.github/workflows/pr-policy.yml@9a3e1c923824fbd71b5dad45976c6e66ba2a1a01 # integrated templates main
