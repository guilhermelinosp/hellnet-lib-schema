name: pr-check


concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@745ef1ca8288cd320b0b4dcf1485e34003945c79

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@745ef1ca8288cd320b0b4dcf1485e34003945c79

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@745ef1ca8288cd320b0b4dcf1485e34003945c79
    with:
      app-client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
    secrets: inherit

  policy:
    uses: guilhermelinosp/templates/.github/workflows/pr-policy.yml@745ef1ca8288cd320b0b4dcf1485e34003945c79

  pr-gate:
    if: always()
    needs: [merge-check, gitleaks, labeler, policy]
    runs-on: ubuntu-latest
    steps:
      - name: gate
        shell: python
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          failed = [k for k, v in needs.items() if v.get('result') not in ('success', 'skipped')]
          if failed:
              print('BLOCKED-BY:', failed)
              sys.exit(1)
          print('ALL-GREEN')
