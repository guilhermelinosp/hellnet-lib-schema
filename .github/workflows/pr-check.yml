name: pr-check


concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@8f299961846cf1d0cbf7129a99ea6c3095ec3abd

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@8f299961846cf1d0cbf7129a99ea6c3095ec3abd

  policy:
    uses: guilhermelinosp/templates/.github/workflows/pr-policy.yml@df9f66533749a4a3a4b59c18a828a179800de096

  pr-gate:
    if: always()
    needs: [merge-check, gitleaks, policy]
    runs-on: ubuntu-latest
    steps:
      - name: gate
        shell: python
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          failed = [k for k, v in needs.items() if v.get('result') not in ('success', 'skipped')]
          if failed:
              print('BLOCKED-BY:', failed)
              sys.exit(1)
          print('ALL-GREEN')
