name: pr-check


concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Validate pull request policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)(\([a-zA-Z0-9_.-]+\))?: .+' \
            || { echo 'Invalid PR title; use Conventional Commits'; exit 1; }
          printf '%s' "$PR_BRANCH" | grep -qE '^(feat|fix|ci|chore|docs|refactor|build|test|bot|schema)/[^/]+$' \
            || { echo "Unsupported branch name: $PR_BRANCH"; exit 1; }
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e3bbcdd3b2a7b8e8c0f0c9c9cf5d7e4bc # v2
        continue-on-error: false
      - name: Validate shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r script; do bash -n "$script"; done < <(find scripts -type f -name '*.sh' -print)
