name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@e7d093b460c1e25f16121d509eefcbb597612c95 # main

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@e7d093b460c1e25f16121d509eefcbb597612c95 # main

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@e7d093b460c1e25f16121d509eefcbb597612c95 # main

  policy:
    uses: guilhermelinosp/templates/.github/workflows/pr-policy.yml@df74d94727dface3aa3aa9011ab02b8b037f90ea # integrated templates main
