name: "New Schema"
description: "Request creation of a new event schema"
title: "schema: [name] v1"
labels: [schema]
body:
  - type: input
    id: name
    attributes:
      label: "Schema name"
      description: "Convention: Avro Fast uses fast-{domain}-{event}; JSON/Protobuf may use hellnet-{domain}-{event}"
      placeholder: "fast-ride-requested"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: "Format"
      options:
        - avro
        - json
        - protobuf
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: "Compatibility level"
      options:
        - BACKWARD
        - FORWARD
        - FULL
        - NO_CHECK
      default: 0

  - type: textarea
    id: fields
    attributes:
      label: "Fields (YAML)"
      description: |
        Define fields in YAML format. Types belong to the chosen format:
        Avro: double/long/boolean; JSON: number/integer/boolean;
        Protobuf: double/int64/bool. Protobuf requires an explicit `number`
        for every field; never change or reuse an existing field number.
        `required: false` means nullable with a default in Avro, optional property
        in JSON, and explicit presence (`optional`) in Protobuf. Proto3 has no
        required fields or explicit defaults. Add `doc` to explain a field.
        ```yaml
        - name: orderId
          type: string
          required: true
        - name: amount
          type: double
          required: true
        - name: currency
          type: string
          default: "BRL"
        ```
      placeholder: "- name: orderId\n  type: string\n  required: true"
      render: yaml
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description (optional)"
      description: "Purpose of this event"
      placeholder: "Emitted when an order is created"
